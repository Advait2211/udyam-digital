        <text x="18" y="49" font-size="12.5" font-weight="600" fill="#7c726b">format + check digit + status; returns only needed fields</text>
      </g>
      <g transform="translate(540,200)">

      </g>
      <g transform="translate(788,298)">
        <rect width="232" height="64" rx="14" fill="#fff8f1" stroke="#e7d9cc"/>

        <text x="16" y="49" font-size="12.5" font-weight="600" fill="#7c726b">status from time · slots</text>

        <text x="18" y="94" font-size="12.5" font-weight="700" fill="#ffb020">every call: hard timeout + deterministic fallback</text>
